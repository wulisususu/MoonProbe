name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  MOONBIT_VERSION: 0.10.14+7d59c7ec9

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl --retry 3 --retry-all-errors --retry-delay 3 -fsSL             https://cli.moonbitlang.com/install/unix.sh             | bash -s "$MOONBIT_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          $env:MOONBIT_INSTALL_VERSION = $env:MOONBIT_VERSION
          $attempt = 0
          while ($true) {
            $attempt++
            try {
              $script = Invoke-RestMethod https://cli.moonbitlang.com/install/powershell.ps1
              Invoke-Expression $script
              break
            } catch {
              if ($attempt -ge 3) { throw }
              Start-Sleep -Seconds (3 * $attempt)
            }
          }
          "$HOME\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Show toolchain
        run: moon version --all

      - name: Check
        run: moon check --target native --deny-warn

      - name: Test
        run: moon test --target native

      - name: Build
        run: moon build --target native
