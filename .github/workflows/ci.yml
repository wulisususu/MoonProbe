name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  MOONBIT_VERSION: 0.10.14+7d59c7ec9

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl --retry 3 --retry-all-errors --retry-delay 3 -fsSL             https://cli.moonbitlang.com/install/unix.sh             | bash -s "$MOONBIT_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          $env:MOONBIT_INSTALL_VERSION = $env:MOONBIT_VERSION
          $attempt = 0
          while ($true) {
            $attempt++
            try {
              $script = Invoke-RestMethod https://cli.moonbitlang.com/install/powershell.ps1
              Invoke-Expression $script
              break
            } catch {
              if ($attempt -ge 3) { throw }
              Start-Sleep -Seconds (3 * $attempt)
            }
          }
          "$HOME\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Show toolchain
        run: moon version --all

      - name: Resolve dependencies
        run: moon update

      - name: Check
        run: moon check --target native --deny-warn

      - name: Test
        run: moon test --target native

      - name: Build
        run: moon build --target native

      - name: Check playground bridge
        if: runner.os == 'Linux'
        run: moon check playground_bridge --target js --deny-warn

      - name: Build playground bridge
        if: runner.os == 'Linux'
        run: moon build playground_bridge --target js

      - name: Smoke playground bridge exports
        if: runner.os == 'Linux'
        shell: bash
        run: |
          BRIDGE="$(find _build/js -type f -name '*.js' | grep 'playground_bridge' | head -n 1)"
          test -n "$BRIDGE"
          cp "$BRIDGE" /tmp/moonprobe_bridge.mjs
          node --input-type=module <<'NODE'
          const bridge = await import("file:///tmp/moonprobe_bridge.mjs");
          const request = JSON.stringify({
            name: "Smoke",
            method: "GET",
            url: "{{base_url}}/todos/1",
            assertions: [
              { type: "status_is", expected: 200 },
              { type: "json_equals", path: "$.id", expected: 1 }
            ]
          });
          const env = JSON.stringify({ base_url: "https://example.test" });
          const prepared = JSON.parse(bridge.prepare_request_json(request, env));
          if (!prepared.ok || prepared.request.url !== "https://example.test/todos/1") {
            throw new Error("prepare_request_json bridge smoke failed");
          }
          const response = JSON.stringify({
            status: 200,
            headers: [{ name: "content-type", value: "application/json" }],
            body: "{\"id\":1}",
            duration_ms: 12
          });
          const report = JSON.parse(bridge.evaluate_response_report_json(request, response));
          if (!report.passed || report.requests?.[0]?.assertions?.length !== 2) {
            throw new Error("evaluate_response_report_json bridge smoke failed");
          }
          console.log("playground bridge smoke: ok");
          NODE
          cp playground/app.js /tmp/moonprobe_app.mjs
          node --check /tmp/moonprobe_app.mjs
